[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling==1.26.3" ]

[project]
name = "git-archive-deep"
version = "0.1.3"
description = "Archive git repositories deeply (including all nested submodules)."
readme = "README.md"
authors = [
  { name = "CD Clark III", email = "clifton.clark@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "click>=8.4.2",
]

scripts."git-archive-deep" = "git_archive_deep.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [ "src/git_archive_deep/" ]

[tool.uv]
managed = true
